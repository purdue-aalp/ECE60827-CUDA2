name: Autograding Tests

'on':
  - push
  - repository_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: self-hosted

    if: github.actor != 'github-classroom[bot]'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # -----------------------------
    # Build step (fails job on error)
    # -----------------------------
    - name: Build
      run: |
        set -e
        module load gcc/11.4.1 cuda ngc pytorch
        srun -c4 -A gpu --gres=gpu:1 bash -c 'module load gcc/11.4.1 cuda ngc pytorch && python3 setup.py build_ext --inplace'

    # -----------------------------
    # Part A: Naive GEMM (15 points)
    # -----------------------------
    - name: Part A - Naive GEMM
      id: part-a
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Part A - Naive GEMM (15 points)"
        command: >
          bash -lc '
            module load gcc/11.4.1 cuda ngc pytorch &&
            python3 test_gemm.py --part-a
          '
        timeout: 120
        max-score: 15

    # -----------------------------
    # Part B: Shared Memory GEMM (15 points)
    # -----------------------------
    - name: Part B - Shared Memory GEMM
      id: part-b
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Part B - Shared Memory GEMM (15 points)"
        command: >
          bash -lc '
            module load gcc/11.4.1 cuda ngc pytorch &&
            python3 test_gemm.py --part-b
          '
        timeout: 120
        max-score: 15

    # -----------------------------
    # Part C: Loop Unrolling GEMM (40 points)
    # -----------------------------
    - name: Part C - Loop Unrolling GEMM
      id: part-c
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Part C - Loop Unrolling GEMM (40 points)"
        command: >
          bash -lc '
            module load gcc/11.4.1 cuda ngc pytorch &&
            python3 test_gemm.py --part-c
          '
        timeout: 120
        max-score: 40

    # -----------------------------
    # Report grades (MUST be last)
    # -----------------------------
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        PART-A_RESULTS: "${{ steps.part-a.outputs.result }}"
        PART-B_RESULTS: "${{ steps.part-b.outputs.result }}"
        PART-C_RESULTS: "${{ steps.part-c.outputs.result }}"
      with:
        runners: part-a,part-b,part-c
